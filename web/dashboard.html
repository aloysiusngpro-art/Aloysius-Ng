(async()=>{await window.anhAccount.ready;
const storageKey='anh-saved-reports-v1',list=document.querySelector('#list'),search=document.querySelector('#search');
let reports=[];try{const saved=window.anhAccount.list();if(Array.isArray(saved))reports=saved}catch{}
